name: Accessibility Testing

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  accessibility:
    name: Pa11y Accessibility Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start web application
        run: |
          uvicorn src.web.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for app to start..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/ > /dev/null; do sleep 1; done' \
            || { echo "ERROR: application failed to start within 60 seconds"; exit 1; }
          echo "App is ready!"

      - name: Run pa11y-ci accessibility tests
        run: pa11y-ci --config .pa11yci
